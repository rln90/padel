# Cloudflare Worker für das Padel-Turnier (Phase 1: nur Server). Phase 3 beschreibt die Einrichtung Schritt für Schritt.
name = "padel-turnier"
main = "server/worker.mjs"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "TOURNAMENT"
class_name = "TournamentDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TournamentDO"]

# Geheimnisse (nicht hier eintragen, sondern im Cloudflare-Dashboard unter Einstellungen > Variablen und Geheimnisse):
#   CREATE_KEY = beliebiges langes Passwort. Nur wer es kennt, darf Turniere anlegen.
