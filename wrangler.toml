# Cloudflare Worker für das Padel-Turnier. Einrichtung: siehe docs/EINRICHTUNG.md
name = "padel-turnier"
main = "server/worker.mjs"
compatibility_date = "2025-09-01"
# Im Dashboard angelegte Variablen bleiben bei jedem Deploy erhalten (sonst löscht Wrangler sie).
keep_vars = true

# Fehlerprotokoll im Cloudflare-Dashboard (Worker, Reiter Observability / Logs)
[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "TOURNAMENT"
class_name = "TournamentDO"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "LimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TournamentDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LimiterDO"]

# Geheimnisse (nicht hier eintragen, sondern im Cloudflare-Dashboard unter Einstellungen > Variablen und Geheimnisse, Typ „Geheimnis“):
#   CREATE_KEY = beliebiges langes Passwort. Nur wer es kennt, darf Turniere anlegen.

# Vorschauen pro Pull Request (Cloudflare Worker Previews, Workflow .github/workflows/preview.yml).
# Jede Vorschau bekommt eigenen Speicher. Der Schlüssel gilt nur dort und ist bewusst nicht geheim.
[previews.vars]
CREATE_KEY = "vorschau"
